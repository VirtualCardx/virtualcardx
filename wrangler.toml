name = "vcx-new"
main = "index.js"
compatibility_date = "2025-04-30"
account_id = "ce642be238771f93eee372d5035c488d"
workers_dev = true

# 自托管 IBM Plex 字体（Plex Sans 可变字重 + Plex Mono 400/500/600）。
# 不引 Google Fonts：第三方字体 CDN 会带一个渲染阻塞请求和一次 DNS/TLS 往返，
# 而且中文字面本来就只能靠系统栈。
[assets]
directory = "./public"
# 只让 /fonts/* 走静态资源；其余路径交给 Worker 的 Hono 路由与 catch-all。

[[d1_databases]]
binding = "DB"
database_name = "vcx-db"
database_id = "d8d9395b-2580-41ba-8ce9-300b5754b42d"

[[r2_buckets]]
binding = "R2"
bucket_name = "vcx-media"
# 仅对 `wrangler dev` 生效: 本地调样式时直接读线上图片桶, 否则本地 R2 为空、
# 所有缩略图 404。`wrangler deploy` 忽略该字段。
remote = true

# 搜索与写 API 的按 IP 限流。namespace_id 在同一账号内唯一即可。
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[observability]
enabled = true
head_sampling_rate = 1
